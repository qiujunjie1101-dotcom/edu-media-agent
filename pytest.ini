[pytest]
# ============================================================================
# pytest 配置
# ============================================================================
# 说明：本项目 S1–S4 阶段没有独立的 pytest 配置文件，靠默认行为即可工作。
# S5 引入 PostgreSQL 集成测试后需要注册自定义标记（否则 pytest 会对未注册的
# 标记发出 PytestUnknownMarkWarning），因此在此新增。

markers =
    postgres: 需要真实 PostgreSQL 实例的集成测试。未设置环境变量 TEST_POSTGRES_URI 时自动跳过，因此本机没有数据库也能跑完整测试套件。

# 测试发现规则：沿用默认（test_*.py / *_test.py），显式写出来是为了
# 让「哪些目录会被收集」一目了然。
testpaths = tests
python_files = test_*.py
